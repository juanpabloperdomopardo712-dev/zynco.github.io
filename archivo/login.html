<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zynco | Iniciar Sesión</title>

    <meta name="description" content="Sistema de gestión de alquiler de vehículos Zynco.">

    <link rel="icon" href="img/coche.png" type="image/png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <!--==========================
                    LOGO
            ==========================-->

            <div class="login-logo">

                <img src="/img/logo_zinco.png" alt="Logo Zynco">

            </div>

            <!--==========================
                    FORMULARIO
            ==========================-->

            <div class="login-form">

                <h1>Bienvenido</h1>

                <p>Inicia sesión para administrar Zynco.</p>

                <form id="loginForm">

                    <div class="input-group">

                        <label for="usuario">

                            <i class="fa-solid fa-user"></i>

                            Usuario

                        </label>

                        <input
                            type="text"
                            id="usuario"
                            placeholder="Ingrese su usuario"
                            required>

                    </div>

                    <div class="input-group">

                        <label for="password">

                            <i class="fa-solid fa-lock"></i>

                            Contraseña

                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Ingrese su contraseña"
                            required>

                    </div>

                    <button type="submit" class="btn-login">
                        

                        <i class="fa-solid fa-right-to-bracket"></i>

                        <a href="/index.html">Iniciar sesión</a>

                    </button>

                </form>

            </div>

        </section>

    </main>

    <script src="/js/app.js"></script>

</body>

</html>
